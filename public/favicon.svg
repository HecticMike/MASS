<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#050d22"/>
      <stop offset="100%" stop-color="#0b1535"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%"   stop-color="#ff8a5c"/>
      <stop offset="22%"  stop-color="#ffd84f"/>
      <stop offset="48%"  stop-color="#5ed8c7"/>
      <stop offset="72%"  stop-color="#4fa8ff"/>
      <stop offset="100%" stop-color="#b27cff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="innerGlow" cx="38%" cy="35%" r="55%">
      <stop offset="0%"   stop-color="#2a9cff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2a9cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b27cff"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#innerGlow)"/>

  <g opacity="0.07" stroke="#9fb0d5" stroke-width="1">
    <line x1="0"   y1="170" x2="512" y2="170"/>
    <line x1="0"   y1="256" x2="512" y2="256"/>
    <line x1="0"   y1="342" x2="512" y2="342"/>
    <line x1="128" y1="0"   x2="128" y2="512"/>
    <line x1="256" y1="0"   x2="256" y2="512"/>
    <line x1="384" y1="0"   x2="384" y2="512"/>
  </g>

  <path
    d="M 90 174 C 148 174, 182 210, 224 258 C 264 304, 290 340, 370 352"
    fill="none"
    stroke="url(#arc)"
    stroke-width="36"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
    opacity="0.95"
  />

  <circle cx="370" cy="352" r="26" fill="url(#dotGrad)" filter="url(#glow)"/>
  <circle cx="370" cy="352" r="14" fill="#ffffff" opacity="0.9"/>
  <circle cx="90"  cy="174" r="18" fill="#ff8a5c" opacity="0.85" filter="url(#glow)"/>
  <circle cx="90"  cy="174" r="9"  fill="#ffffff" opacity="0.8"/>
</svg>
